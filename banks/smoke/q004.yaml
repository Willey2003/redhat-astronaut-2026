kind: hands-on
domain: cluster-ops
level: core
title: Query cluster version
prompt: |
  Query the installed OpenShift version using `oc`. The command must succeed
  and report a semantic version (e.g. 4.x.y).
solution: |
  oc version
  oc get clusterversion version -o jsonpath='{.status.desired.version}'
checks:
  - desc: oc version succeeds
    run: oc version
    exit-success: true
  - desc: Cluster version is a semver
    run: oc get clusterversion version -o jsonpath='{.status.desired.version}'
    matches: ^4\.\d+\.\d+.*
