kind: knowledge
domain: roles-collections
level: core
title: Applying a role in a playbook
prompt: |
  A play must apply the `webserver` role to the `web` group. Which playbook
  construct does this?
options:
  A: A top-level `roles:` list naming webserver
  B: An `include_roles:` key naming webserver
  C: 'A `role_name:` scalar set to webserver'
  D: 'An `apply: webserver` directive under tasks'
answer: A
explanation: |
  Roles are declared at the top level of a play with the `roles:` keyword,
  each entry naming the role (and optionally `vars`, `tags`, or `when`). The
  roles run before the play's tasks unless `pre_tasks` are defined.
solution: |
  A play applies roles with the top-level `roles:` keyword:
  `roles: - webserver`. Each list item can carry role variables and tags. Roles
  run after any pre_tasks and before the play's own tasks, and handlers
  notified by a role are added to the play. Alternatives such as `include_role`
  and `import_role` exist as tasks when a role must run conditionally or
  mid-play.
checks:
  - desc: Names the roles keyword
    contains: "roles:"
  - desc: Shows the webserver role
    contains: "webserver"
  - desc: Mentions pre_tasks ordering
    contains: "pre_tasks"
