kind: knowledge
domain: installation-methods
level: core
title: Which method keeps infrastructure in the team's control
prompt: |
  The team has already built virtual machines, load balancers, and DNS with
  their own automation. Which installation method suits them, where
  openshift-install only generates Ignition configs and does not create
  infrastructure?
options:
  A: UPI (user-provided infrastructure)
  B: IPI (installer-provisioned infrastructure)
  C: Assisted installer
  D: Agent-based installer
answer: A
explanation: |
  UPI (user-provided infrastructure) means the administrator provisions
  machines, networking, load balancing, and DNS themselves; openshift-install
  only generates Ignition configs and later runs the bootstrap. IPI has the
  installer create infrastructure (for example AWS VPCs and machines). Assisted
  and Agent-based installs are separate methods with their own provisioning
  flow.
solution: |
  UPI (user-provided infrastructure) keeps infrastructure in the team's
  control: you create the VMs or bare-metal hosts, the load balancers, and the
  DNS records, then use the Ignition configs generated by `openshift-install
  create ignition-configs` to boot nodes. The installer still runs the
  bootstrap and can later verify with `openshift-install wait-for cluster`. IPI
  is the opposite: the installer builds everything from scratch.
checks:
  - desc: Names UPI
    contains: "UPI"
  - desc: Contrasts with IPI
    contains: "IPI"
  - desc: Mentions user-provided infrastructure
    contains: "user-provided"
