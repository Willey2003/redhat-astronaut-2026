kind: hands-on
domain: networking
level: deep
title: Restrict database access with a NetworkPolicy
prompt: |
  In project `lab-01`, pods `web` and `db` run labelled `app=web` and
  `app=db`. Create a NetworkPolicy named `db-ingress` that allows only the web
  pods to reach the db pods on TCP port 5432 and blocks all other ingress.
solution: |
  oc apply -f - <<'EOF'
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: db-ingress
    namespace: lab-01
  spec:
    podSelector:
      matchLabels:
        app: db
    policyTypes:
    - Ingress
    ingress:
    - from:
      - podSelector:
          matchLabels:
            app: web
      ports:
      - protocol: TCP
        port: 5432
  EOF
checks:
  - desc: NetworkPolicy db-ingress exists
    run: oc get networkpolicy db-ingress -n lab-01 -o name
    equals: networkpolicy.networking.k8s.io/db-ingress
  - desc: Policy selects the db pods
    run: "oc get networkpolicy db-ingress -n lab-01 -o jsonpath='{.spec.podSelector.matchLabels.app}'"
    equals: db
  - desc: Policy allows only the web pods
    run: "oc get networkpolicy db-ingress -n lab-01 -o jsonpath='{.spec.ingress[0].from[0].podSelector.matchLabels.app}'"
    equals: web
  - desc: Policy opens TCP port 5432
    run: "oc get networkpolicy db-ingress -n lab-01 -o jsonpath='{.spec.ingress[0].ports[0].port}'"
    equals: 5432
