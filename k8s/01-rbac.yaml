apiVersion: v1
kind: ServiceAccount
metadata:
  name: conductor
  namespace: redhat-astronaut
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: redhat-astronaut-conductor-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: conductor
    namespace: redhat-astronaut
